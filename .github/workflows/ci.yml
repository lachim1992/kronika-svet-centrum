name: Validate Chronicle
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: validate-${{ github.ref }}
  cancel-in-progress: true
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm install --no-audit --no-fund # TEMP: package-lock.json lags behind drizzle devDependencies; restore npm ci after lock refresh
      - run: npm run typecheck
      - run: npm run typecheck:edge
      - run: npm test
      - run: npm run build
